[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snesdriver"
description = "Read what a SNES cartridge says to its coprocessor, out of the cartridge\u2019s own code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["snes", "coprocessor", "dsp", "disassembly", "cartridge", "protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/gufranco/snes-driver-python"
Source = "https://github.com/gufranco/snes-driver-python"
Issues = "https://github.com/gufranco/snes-driver-python/issues"

[tool.setuptools]
packages = ["snesdriver"]

[tool.setuptools.dynamic]
version = { attr = "snesdriver.version.VERSION" }

[tool.setuptools.exclude-package-data]
mapper = ["*.test.py"]

[tool.ruff]
extend-exclude = ["mos65xx-python", "snes-mapper-python"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  # N818 wants every exception to end in Error. The control flow signals here are
  # named the way CPython names its own: StopIteration, SystemExit and
  # GeneratorExit carry no suffix either. The exceptions that report a genuine
  # failure do end in Error.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# A test file sits beside the module it covers and is named after it, so its
# module name carries a dot that N999 rejects. The layout is deliberate: a
# module and its tests are read together.
"*.test.py" = ["PLR2004", "N999"]
# These are command line tools. Printing is their output, not a stray debug
# statement left behind, and routing it through a logger would put a level and
# a timestamp in front of a report meant to be read by a person.
# The packages this is built on are submodules rather than installed
# distributions, so their paths go on sys.path before they can be imported.
# Nothing else in these files runs before those imports.
"conformance/*.py" = ["T201", "E402"]
"snesdriver/*.test.py" = ["E402"]

[tool.mypy]
# Every flag mypy has, plus the ones strict does not turn on. This reads somebody
# else's machine code and reports what it found, so the errors that matter are the
# ones where a width, an offset or a None crosses a boundary it should not.
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["snesdriver", "conformance"]
# The directory a user keeps their games in is called cartridges, and so is a
# module in conformance. A bare `import cartridges` is therefore ambiguous: the
# checker resolves it to the directory, which is an implicit namespace package
# with nothing in it, and every attribute reads as missing. The scripts import it
# package-qualified instead, which is unambiguous at runtime and here.
exclude = "^(cartridges|firmware)/"

[[tool.mypy.overrides]]
# The submodules are checked in their own repositories, against their own gate.
# Following imports into them here would report the state of somebody else's
# project and a finding nobody in this one can act on.
module = ["mos65xx.*", "mapper.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["snesdriver", "conformance"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  # The command line guard hands argv to a function that is itself tested, so
  # there is nothing behind it left to exercise. Importing the module to cover
  # the guard would run the tool rather than test it.
  'if __name__ == "__main__":',
  # The installed console command is that same guard wearing a name setuptools can
  # point an entry point at. It reads argv and raises SystemExit around a function
  # the tests drive directly.
  "def command\\(\\):",
  # A type checking block never runs, by definition. Python 3.14 drops it before
  # coverage can see it and earlier versions do not, so leaving it in would make
  # the gate mean one thing on the newest runtime and another on the oldest
  # supported one, which is worse than either.
  'if TYPE_CHECKING:',
  # A protocol method has no body to run, whether the ellipsis sits on its own
  # line or after the signature. The same version split applies.
  '^\\s*\\.\\.\\.$',
  ': \\.\\.\\.$',
]
