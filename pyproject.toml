[tool.setuptools]
packages = ["snesdriver"]

[tool.setuptools.dynamic]
version = { attr = "snesdriver.version.VERSION" }

[tool.setuptools.exclude-package-data]
mapper = ["*.test.py"]

[tool.ruff]
extend-exclude = ["mos65xx-python", "snes-mapper-python"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"snesdriver/environment.py" = ["BLE001", "T201"]
"conformance/family_*.py" = ["RUF100"]
"*.test.py" = ["PLR2004", "N999"]
"snesdriver/doctor.py" = ["BLE001", "T201"]
"conformance/*.py" = ["T201", "E402"]
"snesdriver/*.test.py" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["snesdriver", "conformance"]
exclude = "^(cartridges|firmware)/"

[[tool.mypy.overrides]]
module = ["mos65xx.*", "mapper.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
branch = true
omit = ["mos65xx-python/*", "snes-mapper-python/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  'if TYPE_CHECKING:',
  '^\s*\.\.\.$',
  ': \.\.\.$',
  '@unittest\.skipUnless\(CLOCKED,',
  '@unittest\.skipUnless\(A_PART,',
  '@unittest\.skipUnless\(A_PART and BUILDABLE,',
  '^def accounts_for_a_reset\(',
  '@unittest\.skipUnless\(QUOTED,',
  '@unittest\.skipUnless\(VARIANTS,',
  '^def built\(',
  '@unittest\.skipUnless\(SOLD_AS_A_COMPONENT,',
  '^def machine_mentions\(',
  '^def listing\(',
]
