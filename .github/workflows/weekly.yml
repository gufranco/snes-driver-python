---
name: Weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Take the newest submodules rather than the pinned ones
        run: git submodule update --remote --recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the newest tools, unpinned on purpose in this file alone
        run: |
          python -m pip install --disable-pip-version-check \
            --upgrade ruff mypy coverage

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: mypy

      - name: Every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesdriver conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must still be total
        run: python -m coverage report

      - name: Read whatever cartridges are here
        run: |
          set +e
          python -m conformance.against_cartridges
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            note="Nothing was read. It is not a failure; there was nothing to read."
            echo "::notice title=No cartridge present::${note}"
            exit 0
          fi
          exit "${status}"
        shell: bash

  pins:
    name: How far behind the submodules are
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compare every pin against its upstream head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=0
          owner="${GITHUB_REPOSITORY%%/*}"
          advice="Bump it, run the suite, and read what changed"
          advice="${advice} before recording any new output."
          git submodule status | while read -r sha path _rest; do
            sha="${sha#[-+]}"
            name="${path##*/}"
            head=$(gh api "repos/${owner}/${name}/commits?per_page=1" \
              --jq '.[0].sha')
            if [ "${sha}" = "${head}" ]; then
              echo "${name}: at head"
              continue
            fi
            count=$(gh api "repos/${owner}/${name}/compare/${sha}...${head}" \
              --jq '.ahead_by')
            title="${name} is behind"
            echo "::warning title=${title}::${count} commits behind ${head}. ${advice}"
          done
          exit "${behind}"
        shell: bash
