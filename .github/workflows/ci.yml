name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install the release tooling
        run: pnpm install --frozen-lockfile

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesdriver conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  cartridges:
    name: Cartridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the driver in every cartridge present
        run: |
          # 0 when every cartridge spoke to the part, 1 when one did not, and 2
          # when none is here. Only 1 is a failure: a hosted runner has no
          # cartridge and never will.
          status=0
          python conformance/against_cartridges.py || status="$?"
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=Cartridges::No cartridge is present on a hosted runner, so the driver sweep was skipped rather than passed. It confirms each cartridge against four digests, disassembles the routine that drives its coprocessor, and reports the exchange. Run it locally with copies you own, or point SNES_CARTRIDGE_DIR at them."
            exit 0
          fi
          exit "${status}"
        shell: bash
