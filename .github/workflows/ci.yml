name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the release tooling
        run: pnpm install --frozen-lockfile

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      # The disassembler and the mapper arrive through submodules, and the checker
      # follows the imports into them. Without the checkout it would report the
      # whole backend as missing rather than as wrong.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the version offers. The settings
      # live in pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesdriver conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A routine must still walk faster than the floor
        run: python -m conformance.speed

  cartridges:
    name: Cartridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the driver in every cartridge present
        run: |
          # 0 when every cartridge spoke to the part, 1 when one did not, and 2
          # when none is here. Only 1 is a failure: a hosted runner has no
          # cartridge and never will.
          status=0
          python -m conformance.against_cartridges || status="$?"
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=Cartridges::No cartridge is present on a hosted runner, so the driver sweep was skipped rather than passed. It confirms each cartridge against four digests, disassembles the routine that drives its coprocessor, and reports the exchange. Run it locally with copies you own, or point SNES_CARTRIDGE_DIR at them."
            exit 0
          fi
          exit "${status}"
        shell: bash
